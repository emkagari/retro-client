<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite editor</title>
<style>
  :root {
    --bg: #1d1b18; --panel: #26231f; --panel2: #2e2a25; --line: #3d3832; --text: #e8e2d6; --dim: #9a9184;
    --accent: #e0a040; --accent2: #6aa8e8; --bad: #e06050; --good: #7cc070;
    --lib-w: 260px; --side-w: 320px;
    font: 13px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: grid; grid-template: "top top top" auto "lib tabs side" auto "lib stage side" 1fr "lib log side" auto / var(--lib-w) 1fr var(--side-w); overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #5a4220; border-color: var(--accent); }
  button.on { border-color: var(--accent); color: var(--accent); }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent2); }
  textarea.invalid { border-color: var(--bad); }

  #top { grid-area: top; display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top .title { font-weight: 600; margin-right: 6px; }
  #status { margin-left: auto; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status.bad { color: var(--bad); } #status.good { color: var(--good); }
  .sep { width: 1px; align-self: stretch; background: var(--line); }

  #tabbar { grid-area: tabs; display: flex; gap: 2px; padding: 4px 6px 0; background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; min-height: 31px; }
  #tabbar .tab { display: flex; gap: 6px; align-items: center; padding: 3px 6px 3px 10px; border: 1px solid var(--line); border-bottom: none; border-radius: 5px 5px 0 0; background: var(--bg); cursor: pointer; white-space: nowrap; max-width: 240px; color: var(--dim); }
  #tabbar .tab.on { background: #3a2f20; color: var(--text); border-color: var(--accent); }
  #tabbar .tab .label { overflow: hidden; text-overflow: ellipsis; }
  #tabbar .tab .dot { color: var(--accent); }
  #tabbar .tab .x { border: none; background: none; padding: 0 3px; color: var(--dim); }
  #tabbar .tab .x:hover { color: var(--bad); }
  #tabbar .none { color: var(--dim); padding: 5px; font-size: 12px; }

  #lib { grid-area: lib; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; position: relative; }
  #tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); }
  #tabs button { padding: 2px 7px; font-size: 12px; }
  #search { margin: 6px; }
  #list { overflow: auto; flex: 1; padding: 0 4px 8px; }
  #list .item { padding: 3px 6px; border-radius: 3px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .item:hover { background: var(--panel2); }
  #list .item.on { background: #4a3a22; }
  #list .item small { color: var(--dim); font-family: ui-monospace, monospace; }
  #list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); grid-auto-rows: 72px; gap: 4px; align-content: start; }
  #list.grid .thumb { height: 72px; background: #3a3631; border: 1px solid var(--line); border-radius: 3px; display: flex; align-items: center; justify-content: center; position: relative; cursor: grab; overflow: hidden; }
  #list.grid .thumb:hover { border-color: var(--accent); }
  #list.grid .thumb img { width: 60px; height: 52px; object-fit: contain; }
  #list.grid .thumb span { position: absolute; bottom: 0; right: 3px; font-size: 10px; color: var(--dim); }
  .hint { color: var(--dim); padding: 8px; font-size: 12px; }
  .splitter { position: absolute; top: 0; bottom: 0; width: 6px; cursor: col-resize; z-index: 5; }
  .splitter:hover, .splitter.drag { background: #e0a04055; }
  #lib .splitter { right: -3px; } #side .splitter { left: -3px; }

  #stage { grid-area: stage; position: relative; overflow: hidden; user-select: none; background-color: #57534c;
    background-image: linear-gradient(45deg, #4d4943 25%, transparent 25%, transparent 75%, #4d4943 75%), linear-gradient(45deg, #4d4943 25%, transparent 25%, transparent 75%, #4d4943 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px; }
  #stage.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #stage .item { cursor: move; }
  #stage .item.hidden { display: none; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: #d8d0c0; pointer-events: none; text-align: center; }
  #frames { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; background: #26231fcc; padding: 4px 8px; border-radius: 4px; }
  #zoomInfo { position: absolute; right: 10px; bottom: 10px; background: #26231fcc; padding: 2px 8px; border-radius: 4px; color: var(--dim); }

  #side { grid-area: side; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; position: relative; }
  #side h3 { margin: 0; padding: 7px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; gap: 4px; align-items: center; }
  #side h3 .grow { flex: 1; }
  #side h3 button { padding: 0 6px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  #layers { overflow: auto; flex: 1; min-height: 120px; }
  #layers .layer { display: flex; gap: 5px; align-items: center; padding: 2px 10px 2px 6px; cursor: pointer; border-bottom: 1px solid #2c2925; white-space: nowrap; }
  #layers .layer:hover { background: var(--panel2); }
  #layers .layer.on { background: #4a3a22; }
  #layers .layer.above { box-shadow: inset 0 2px 0 var(--accent); }
  #layers .layer.below { box-shadow: inset 0 -2px 0 var(--accent); }
  #layers .layer.into { outline: 1px dashed var(--accent); outline-offset: -2px; background: #4a3a2288; }
  #layers .layer.dragging { opacity: .4; }
  #layers .layer.child { color: var(--dim); }
  #layers .layer.ignored .what, #layers .layer.ignored .d { color: #e06050; text-decoration: line-through; }
  #layers .layer .tw { width: 14px; text-align: center; color: var(--dim); flex: none; }
  #layers .layer .tw.can:hover { color: var(--accent); }
  #layers .layer .d { color: var(--dim); font-family: ui-monospace, monospace; min-width: 30px; text-align: right; flex: none; }
  #layers .layer .what { overflow: hidden; text-overflow: ellipsis; flex: 1 1 auto; min-width: 5em; }
  #layers .layer .name { color: var(--accent2); overflow: hidden; text-overflow: ellipsis; }
  #layers .layer .said { color: var(--dim); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 4 auto; min-width: 0; }
  #layers .layer .codehid { color: #e0a040; flex: none; }
  #layers .layer .eye { opacity: .5; flex: none; } #layers .layer .eye.off { opacity: .15; }
  #inspector { overflow: auto; flex: 1.3; padding: 8px 10px; border-top: 1px solid var(--line); }
  #inspector .row { display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; margin-bottom: 5px; }
  #inspector label { color: var(--dim); }
  #inspector textarea { width: 100%; height: 140px; font-family: ui-monospace, monospace; font-size: 11px; resize: vertical; }
  #inspector h4.params { margin: 12px 0 4px; font-size: 12px; color: var(--accent); font-weight: 600; }
  #inspector .row.p { grid-template-columns: 96px 1fr auto; }
  #inspector .row.p label { overflow: hidden; text-overflow: ellipsis; }
  #inspector .row button.x { padding: 0 6px; }
  #inspector input.bad { border-color: #e06050; }
  #inspector .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }

  #log { grid-area: log; max-height: 30vh; overflow: auto; background: #151412; border-top: 1px solid var(--line); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; padding: 0 10px; display: none; position: relative; }
  #log.open { display: block; padding: 6px 10px; }
  #log a { color: var(--accent2); cursor: pointer; }
  #log .close { position: sticky; float: right; top: 0; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
  <div id="top">
    <span class="title">Sprite editor</span>
    <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button id="redo" title="Redo (Ctrl+Y)" disabled>↷</button>
    <button id="save" class="primary" title="Save this tab (Ctrl+S): checked by the build's encoder, then written" disabled>Save</button>
    <button id="saveAll" title="Save every tab with changes (Ctrl+Shift+S)" disabled>Save all</button>
    <div class="sep"></div>
    <button id="build" title="Build the loader from what's saved (tools/build.mjs)">Build</button>
    <button id="newSprite" title="A new sprite in src/assets/new/">New sprite</button>
    <button id="whereUsed" title="Where this is placed" disabled>Where used</button>
    <div class="sep"></div>
    <button id="screen" title="The game's screen: 742×556, the map 742×432 above the banner (an interface is attached at its top left)">Screen</button>
    <button id="components" title="Components (Button, Label, Window…) drawn as their code draws them, from their parameters and styles — off: what the files hold (their transparent boundingBox_mc)">Components</button>
    <button id="outlines" title="Every line's box and name (O)">Outlines</button>
    <button id="fit" title="Fit (F)">Fit</button>
    <button id="reload" title="Read the files again (an SVG edited in Inkscape…); unsaved changes stay">Reload files</button>
    <span id="status"></span>
  </div>

  <div id="tabbar"></div>

  <div id="lib">
    <div id="tabs"></div>
    <input id="search" placeholder="Search: name or id">
    <div id="list"></div>
    <div class="splitter" data-var="--lib-w" data-dir="1"></div>
  </div>

  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs id="defs"></defs>
      <g id="view">
        <g id="axes" stroke="#ffffff55" stroke-width="1">
          <line x1="-10000" y1="0" x2="10000" y2="0" vector-effect="non-scaling-stroke"></line>
          <line x1="0" y1="-10000" x2="0" y2="10000" vector-effect="non-scaling-stroke"></line>
        </g>
        <g id="content"></g>
        <g id="outlineLayer"></g>
        <g id="screenFrame" pointer-events="none" fill="none" hidden>
          <rect x="0" y="0" width="742" height="556" stroke="#7cc070" stroke-width="1.5" vector-effect="non-scaling-stroke"></rect>
          <line x1="0" y1="432" x2="742" y2="432" stroke="#7cc070" stroke-dasharray="6 4" vector-effect="non-scaling-stroke"></line>
          <text x="4" y="-6" fill="#7cc070" font-size="12" stroke="none">game screen 742×556</text>
          <text x="4" y="446" fill="#7cc070" font-size="11" stroke="none">map 742×432 · banner below</text>
        </g>
        <g id="overlay" pointer-events="none"></g>
      </g>
    </svg>
    <div id="empty">Open a sprite on the left (each opens in a tab; nothing is written until you save).<br><small>Drag shapes and symbols onto it · <kbd>←↑→↓</kbd> nudge · <kbd>Del</kbd> remove · wheel: zoom · drag the background: pan</small></div>
    <div id="frames" hidden>
      <label id="frameBox">frame <input id="frame" type="number" min="1" value="1" style="width:60px"> <span id="frameCount"></span></label>
      <select id="state" hidden><option>up</option><option>over</option><option>down</option><option>hit</option></select>
    </div>
    <div id="zoomInfo">100%</div>
  </div>

  <div id="side">
    <div class="splitter" data-var="--side-w" data-dir="-1"></div>
    <h3><span class="grow">Layers</span><button id="group" title="Group (Ctrl+G): wrap it in a new sprite, src/assets/new/…/group-N.json — what's inside follows it">Group</button><button id="ungroup" title="Ungroup (Ctrl+Shift+G): what this placed sprite holds, put in its place (its definition stays)">Ungroup</button><button id="up" title="Bring forward">↑</button><button id="down" title="Send backward">↓</button><button id="remove" title="Remove (Del)">✕</button></h3>
    <div id="layers"></div>
    <h3>Inspector</h3>
    <div id="inspector"><div class="hint">Select a layer.</div></div>
  </div>

  <div id="log"></div>

  <script type="module" src="editor.js"></script>
</body>
</html>
