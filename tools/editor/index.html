<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprite editor</title>
<style>
  :root {
    --bg: #1d1b18; --panel: #26231f; --panel2: #2e2a25; --line: #3d3832; --text: #e8e2d6; --dim: #9a9184;
    --accent: #e0a040; --accent2: #6aa8e8; --bad: #e06050; --good: #7cc070;
    font: 13px/1.4 system-ui, sans-serif; color: var(--text); background: var(--bg);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; height: 100vh; display: grid; grid-template: "top top top" auto "lib stage side" 1fr "lib log side" auto / 260px 1fr 300px; overflow: hidden; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: #5a4220; border-color: var(--accent); }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; min-width: 0; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent2); }

  #top { grid-area: top; display: flex; gap: 8px; align-items: center; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #top .title { font-weight: 600; margin-right: 6px; }
  #doc { color: var(--dim); font-family: ui-monospace, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #doc.dirty::after { content: " ●"; color: var(--accent); }
  #status { margin-left: auto; color: var(--dim); white-space: nowrap; }
  #status.bad { color: var(--bad); } #status.good { color: var(--good); }
  .sep { width: 1px; align-self: stretch; background: var(--line); }

  #lib { grid-area: lib; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); min-height: 0; }
  #tabs { display: flex; flex-wrap: wrap; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); }
  #tabs button { padding: 2px 7px; font-size: 12px; }
  #tabs button.on { border-color: var(--accent); color: var(--accent); }
  #search { margin: 6px; }
  #list { overflow: auto; flex: 1; padding: 0 4px 8px; }
  #list .item { padding: 3px 6px; border-radius: 3px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list .item:hover { background: var(--panel2); }
  #list .item.on { background: #4a3a22; }
  #list .item small { color: var(--dim); font-family: ui-monospace, monospace; }
  #list.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 4px; align-content: start; }
  #list.grid .thumb { aspect-ratio: 1; background: #3a3631; border: 1px solid var(--line); border-radius: 3px; display: grid; place-items: center; position: relative; cursor: grab; overflow: hidden; }
  #list.grid .thumb img { max-width: 90%; max-height: 80%; }
  #list.grid .thumb span { position: absolute; bottom: 1px; right: 3px; font-size: 10px; color: var(--dim); }
  .hint { color: var(--dim); padding: 8px; font-size: 12px; }

  #stage { grid-area: stage; position: relative; overflow: hidden; background-color: #57534c;
    background-image: linear-gradient(45deg, #4d4943 25%, transparent 25%, transparent 75%, #4d4943 75%), linear-gradient(45deg, #4d4943 25%, transparent 25%, transparent 75%, #4d4943 75%);
    background-size: 20px 20px; background-position: 0 0, 10px 10px; }
  #stage.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #stage .item { cursor: move; }
  #stage .item.hidden { display: none; }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: #d8d0c0; pointer-events: none; text-align: center; }
  #frames { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px; align-items: center; background: #26231fcc; padding: 4px 8px; border-radius: 4px; }
  #zoomInfo { position: absolute; right: 10px; bottom: 10px; background: #26231fcc; padding: 2px 8px; border-radius: 4px; color: var(--dim); }

  #side { grid-area: side; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }
  #side h3 { margin: 0; padding: 7px 10px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--dim); border-bottom: 1px solid var(--line); display: flex; gap: 4px; align-items: center; }
  #side h3 .grow { flex: 1; }
  #side h3 button { padding: 0 6px; font-size: 12px; text-transform: none; letter-spacing: 0; }
  #layers { overflow: auto; flex: 1; min-height: 120px; }
  #layers .layer { display: flex; gap: 6px; align-items: center; padding: 3px 10px; cursor: pointer; border-bottom: 1px solid #2c2925; white-space: nowrap; }
  #layers .layer:hover { background: var(--panel2); }
  #layers .layer.on { background: #4a3a22; }
  #layers .layer .d { color: var(--dim); font-family: ui-monospace, monospace; width: 34px; text-align: right; }
  #layers .layer .what { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  #layers .layer .name { color: var(--accent2); }
  #layers .layer .eye { opacity: .5; } #layers .layer .eye.off { opacity: .15; }
  #inspector { overflow: auto; flex: 1.3; padding: 8px 10px; border-top: 1px solid var(--line); }
  #inspector .row { display: grid; grid-template-columns: 70px 1fr; gap: 6px; align-items: center; margin-bottom: 5px; }
  #inspector label { color: var(--dim); }
  #inspector textarea { width: 100%; height: 130px; font-family: ui-monospace, monospace; font-size: 11px; resize: vertical; }
  #inspector .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }

  #log { grid-area: log; max-height: 30vh; overflow: auto; background: #151412; border-top: 1px solid var(--line); font-family: ui-monospace, monospace; font-size: 12px; white-space: pre-wrap; padding: 0 10px; display: none; }
  #log.open { display: block; padding: 6px 10px; }
  #log a { color: var(--accent2); cursor: pointer; }
  kbd { background: var(--panel2); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style>
</head>
<body>
  <div id="top">
    <span class="title">Sprite editor</span>
    <span id="doc">no sprite open</span>
    <div class="sep"></div>
    <button id="back" title="Back (Alt+←)" disabled>←</button>
    <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button id="redo" title="Redo (Ctrl+Y)" disabled>↷</button>
    <button id="save" class="primary" title="Save (Ctrl+S): checked by the build's encoder" disabled>Save</button>
    <button id="build" title="Build the loader (tools/build.mjs)">Build</button>
    <button id="newSprite" title="A new sprite in src/assets/new/">New sprite</button>
    <button id="whereUsed" title="Where this is placed" disabled>Where used</button>
    <button id="fit" title="Fit (F)">Fit</button>
    <span id="status"></span>
  </div>

  <div id="lib">
    <div id="tabs"></div>
    <input id="search" placeholder="Search: name or id">
    <div id="list"></div>
  </div>

  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
      <defs id="defs"></defs>
      <g id="view">
        <g id="axes" stroke="#ffffff55" stroke-width="1" vector-effect="non-scaling-stroke">
          <line x1="-10000" y1="0" x2="10000" y2="0" vector-effect="non-scaling-stroke"></line>
          <line x1="0" y1="-10000" x2="0" y2="10000" vector-effect="non-scaling-stroke"></line>
        </g>
        <g id="content"></g>
        <g id="overlay" pointer-events="none"></g>
      </g>
    </svg>
    <div id="empty">Open a sprite on the left.<br><small>Drag shapes and symbols onto it · <kbd>←↑→↓</kbd> nudge · <kbd>Del</kbd> remove · wheel: zoom · drag the background: pan</small></div>
    <div id="frames" hidden>
      <label>frame <input id="frame" type="number" min="1" value="1" style="width:60px"></label>
      <span id="frameCount"></span>
      <select id="state" hidden><option>up</option><option>over</option><option>down</option><option>hit</option></select>
    </div>
    <div id="zoomInfo">100%</div>
  </div>

  <div id="side">
    <h3><span class="grow">Layers</span><button id="up" title="Bring forward (swap depth)">↑</button><button id="down" title="Send backward (swap depth)">↓</button><button id="remove" title="Remove (Del)">✕</button></h3>
    <div id="layers"></div>
    <h3>Inspector</h3>
    <div id="inspector"><div class="hint">Select a layer.</div></div>
  </div>

  <div id="log"></div>

  <script type="module" src="editor.js"></script>
</body>
</html>
